<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Anton";
          src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
          font-weight: 400;
        }
        @font-face {
          font-family: "Jakarta";
          src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
        }
        @font-face {
          font-family: "Jakarta";
          src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2");
          font-weight: 800;
        }
        #root {
          position: absolute;
          inset: 0;
          color: #ffffff;
        }
        #s3-wrap {
          position: absolute;
          inset: 0;
        }
        #s3-kicker {
          position: absolute;
          left: 110px;
          top: 220px;
          padding: 10px 24px;
          border-radius: 999px;
          background: #1f8a70;
          color: #ffffff;
          font-family: "Jakarta", sans-serif;
          font-weight: 800;
          font-size: 34px;
          letter-spacing: 0.12em;
        }
        #s3-title {
          position: absolute;
          left: 110px;
          right: 110px;
          top: 300px;
          font-family: "Anton", sans-serif;
          font-size: 104px;
          line-height: 1.06;
          text-transform: uppercase;
        }
        #s3-title-accent {
          color: #8bd1b9;
        }
        #s3-list {
          position: absolute;
          left: 110px;
          right: 110px;
          top: 560px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .s3-row {
          display: flex;
          align-items: center;
          gap: 28px;
          height: 142px;
          padding: 0 40px;
          border-radius: 30px;
          background: #ffffff;
          color: #12455a;
        }
        .s3-num {
          flex: 0 0 84px;
          width: 84px;
          height: 84px;
          border-radius: 50%;
          background: #1f8a70;
          color: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Anton", sans-serif;
          font-size: 50px;
        }
        .s3-text {
          font-family: "Jakarta", sans-serif;
          font-weight: 800;
          font-size: 38px;
          line-height: 1.2;
        }
        .s3-text-soft {
          font-weight: 700;
          color: #12455a;
        }
      </style>

      <div id="root" data-composition-id="s3-tanda" data-width="1080" data-height="1920">
        <div id="s3-wrap">
          <div id="s3-kicker">5 TANDA</div>
          <div id="s3-title">Bawa anak jumpa <span id="s3-title-accent">doktor jika:</span></div>
          <div id="s3-list">
            <div class="s3-row" id="s3-row-1">
              <div class="s3-num">1</div>
              <div class="s3-text">Bernafas laju atau tercungap-cungap</div>
            </div>
            <div class="s3-row" id="s3-row-2">
              <div class="s3-num">2</div>
              <div class="s3-text">Bunyi berdehit <span class="s3-text-soft">(wheezing)</span> ketika bernafas</div>
            </div>
            <div class="s3-row" id="s3-row-3">
              <div class="s3-num">3</div>
              <div class="s3-text">Dada atau perut tertarik ke dalam</div>
            </div>
            <div class="s3-row" id="s3-row-4">
              <div class="s3-num">4</div>
              <div class="s3-text">Batuk berterusan hingga sukar tidur atau makan</div>
            </div>
            <div class="s3-row" id="s3-row-5">
              <div class="s3-num">5</div>
              <div class="s3-text">Inhaler di rumah tidak lagi membantu</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s3-kicker", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.05);
        tl.fromTo("#s3-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.15);
        // Each row lands with its line of narration; earlier rows step back.
        const starts = [0.5, 3.6, 7.0, 10.6, 14.2];
        starts.forEach((t, i) => {
          tl.fromTo(
            "#s3-row-" + (i + 1),
            { opacity: 0, x: 90, scale: 0.97 },
            { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "power3.out" },
            t
          );
          if (i > 0) {
            tl.to("#s3-row-" + i, { opacity: 0.72, duration: 0.4, ease: "power1.out" }, t);
          }
        });
        // Recap: all five back at full strength before the cut.
        tl.to(".s3-row", { opacity: 1, duration: 0.4, ease: "power1.out" }, 16.6);
        tl.to("#s3-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 17.65);
        window.__timelines["s3-tanda"] = tl;
      </script>
    </template>
  </body>
</html>
