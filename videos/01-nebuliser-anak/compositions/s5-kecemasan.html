        }
        #s5-badge svg {

          align-items: center;

          font-weight: 800;

          line-height: 1.2;

          border-top: 3px solid #f1e3de;
        }

          flex: 0 0 26px;
          width: 26px;
          height: 26px;
          border-radius: 50%;
          background: #e4572e;

      <div id="root" data-composition-id="s5-kecemasan" data-width="1080" data-height="1920">
        <div id="s5-wrap">
          <div id="s5-tint"></div>
          <div id="s5-badge">

            <div class="s5-item" id="s5-item-2"><span class="s5-dot"></span>Anak terlalu lemah atau mengantuk</div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s5-tint", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
        tl.fromTo("#s5-badge", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.1);
        tl.fromTo("#s5-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.25);
        tl.fromTo("#s5-card", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        tl.fromTo(
          ["#s5-item-1", "#s5-item-2", "#s5-item-3"],
          { opacity: 0, x: 40 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out", stagger: 0.9 },
          0.8
        );
        tl.to("#s5-badge", { scale: 1.06, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.0);
        tl.to("#s5-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 6.65);
        window.__timelines["s5-kecemasan"] = tl;
