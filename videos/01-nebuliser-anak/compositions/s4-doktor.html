<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Anton";
          src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
          font-weight: 400;
        }
        @font-face {
          font-family: "Jakarta";
          src: url("assets/fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
        }
        @font-face {
          font-family: "Jakarta";
          src: url("assets/fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2");
          font-weight: 800;
        }
        #root {
          position: absolute;
          inset: 0;
          color: #ffffff;
        }
        #s4-wrap {
          position: absolute;
          inset: 0;
        }
        #s4-photo {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 230px;
          height: 540px;
          border-radius: 40px;
          overflow: hidden;
          background: #0c3646;
        }
        #s4-photo-img {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s4-avatar {
          position: absolute;
          left: 110px;
          top: 650px;
          width: 240px;
          height: 240px;
          border-radius: 50%;
          overflow: hidden;
          border: 8px solid #ffffff;
          background: #ffffff;
        }
        #s4-avatar img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s4-tag {
          position: absolute;
          left: 380px;
          top: 800px;
          padding: 14px 28px;
          border-radius: 999px;
          background: #1f8a70;
          font-family: "Jakarta", sans-serif;
          font-weight: 800;
          font-size: 34px;
        }
        #s4-copy {
          position: absolute;
          left: 110px;
          right: 110px;
          top: 960px;
        }
        #s4-head {
          font-family: "Anton", sans-serif;
          font-size: 104px;
          line-height: 1.06;
          text-transform: uppercase;
        }
        #s4-head-accent {
          color: #8bd1b9;
        }
        #s4-body {
          margin-top: 24px;
          font-family: "Jakarta", sans-serif;
          font-weight: 700;
          font-size: 44px;
          line-height: 1.3;
          color: #e3f4ee;
        }
      </style>

      <div id="root" data-composition-id="s4-doktor" data-width="1080" data-height="1920">
        <div id="s4-wrap">
          <div id="s4-photo"><img id="s4-photo-img" src="assets/img/lobby.jpg" alt="" /></div>
          <div id="s4-avatar"><img src="assets/img/doctor.jpg" alt="" /></div>
          <div id="s4-tag">Doktor Klinik Medina</div>
          <div id="s4-copy">
            <div id="s4-head">Doktor periksa <span id="s4-head-accent">dahulu</span></div>
            <div id="s4-body">dan tentukan sama ada anak memerlukan nebuliser.</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s4-photo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
        tl.fromTo("#s4-photo-img", { scale: 1.02 }, { scale: 1.14, duration: 6, ease: "none" }, 0);
        tl.fromTo("#s4-avatar", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 0.5);
        tl.fromTo("#s4-tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 0.8);
        tl.fromTo("#s4-head", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.4);
        tl.fromTo("#s4-body", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.0);
        tl.to("#s4-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.65);
        window.__timelines["s4-doktor"] = tl;
      </script>
    </template>
  </body>
</html>
