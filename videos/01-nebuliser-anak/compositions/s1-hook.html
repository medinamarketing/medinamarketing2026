<!doctype html>

  <body>
    <template>

        #root {

        #s1-brand-mark {

        #s1-brand-mark img {
          display: block;

          height: 100%;
        }
        #s1-brand-name {
          font-family: "Jakarta", sans-serif;

          text-transform: uppercase;

        .s1-line {
          display: block;

          position: absolute;
          left: 110px;

        }
        #s1-question {
          position: absolute;
          left: 110px;

        }

      <div id="root" data-composition-id="s1-hook" data-width="1080" data-height="1920">
        <div id="s1-wrap">
          <div id="s1-brand">
            <div id="s1-brand-mark"><img src="assets/img/logo-mark.png" alt="" /></div>

              stroke-linecap="round"

            <path

              d="M0 80 C 70 40, 140 120, 210 80 S 350 40, 420 80 S 560 120, 630 80 S 770 40, 860 80"

              stroke-width="6"
              stroke-linecap="round"

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1-brand", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
        tl.fromTo("#s1-line-1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);
        tl.fromTo("#s1-line-2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.55);
        tl.fromTo(
          ["#s1-wave-1", "#s1-wave-2"],
          { strokeDasharray: 1200, strokeDashoffset: 1200 },
          { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut", stagger: 0.15 },
          0.9
        );
        tl.fromTo("#s1-waves", { scaleY: 1 }, { scaleY: 0.55, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.2);
        tl.fromTo("#s1-question", { opacity: 0, y: 50, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 2.9);
        tl.to("#s1-wrap", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.65);
        window.__timelines["s1-hook"] = tl;
      </script>
