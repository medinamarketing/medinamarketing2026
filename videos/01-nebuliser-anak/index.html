<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Klinik Medina — Bila perlu nebuliser?</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0c3646;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #bg-host,
      .scene-host,
      #captions-host {
        position: absolute;
        inset: 0;
      }
      #bg-host {
        z-index: 0;
      }
      .scene-host {
        z-index: 1;
      }
      #captions-host {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52"
      data-width="1080"
      data-height="1920"
    >
      <!-- Brand background under every scene -->
      <div
        id="bg-host"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="52"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scenes -->
      <div
        id="s1-host"
        class="scene-host"
        data-composition-id="s1-hook"
        data-composition-src="compositions/s1-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s2-host"
        class="scene-host"
        data-composition-id="s2-apa"
        data-composition-src="compositions/s2-apa.html"
        data-start="6"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s3-host"
        class="scene-host"
        data-composition-id="s3-tanda"
        data-composition-src="compositions/s3-tanda.html"
        data-start="13"
        data-duration="18"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s4-host"
        class="scene-host"
        data-composition-id="s4-doktor"
        data-composition-src="compositions/s4-doktor.html"
        data-start="31"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s5-host"
        class="scene-host"
        data-composition-id="s5-kecemasan"
        data-composition-src="compositions/s5-kecemasan.html"
        data-start="37"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="s6-host"
        class="scene-host"
        data-composition-id="s6-cta"
        data-composition-src="compositions/s6-cta.html"
        data-start="44"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Captions (Malay voiceover script) -->
      <div
        id="captions-host"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="52"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Voiceover slot: see README.md (add assets/audio/voiceover.mp3 as an audio clip on track 3). -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
