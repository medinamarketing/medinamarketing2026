      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s5-phone", { y: 820, rotation: 8 }, { y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 0);
        tl.fromTo("#s5-kicker", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.2);
        tl.fromTo("#s5-headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);

        // HbA1c chart card lifts out of the phone (in-phone box: 1328.4, 234.9, w 350.1)
        tl.fromTo(
          "#s5-chart",
          { x: 468.4, y: 4.9, scale: 350.1 / 470, opacity: 0, transformOrigin: "0% 0%" },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.3)", transformOrigin: "0% 0%" },
          1.0
        );
        tl.to("#s5-chart", { y: -10, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.8);

        // 9.2 -> 7.1 count-down
        tl.fromTo("#s5-stat", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);
        const num = document.getElementById("s5-num");
        const state = { v: 9.2 };
        tl.fromTo(
          state,
          { v: 9.2 },
          {
            v: 7.1,
            duration: 1.5,
            ease: "power2.inOut",
            onUpdate: () => {
              num.textContent = state.v.toFixed(1);
            },
          },
          1.5
        );
        tl.fromTo("#s5-num", { color: "#ffffff" }, { color: "#5ed3b0", duration: 0.4, ease: "power1.out" }, 2.8);
        tl.fromTo("#s5-chip-good", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 3.0);
        tl.fromTo("#s5-chip-target", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.2);

        tl.to("#s5-wrap", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 5.6);
        window.__timelines["s5-kronik"] = tl;
