      <script>
        const tl = gsap.timeline({ paused: true });
        // Handoff: the phone starts exactly where scene 2 left it (left 1138px) and glides left.
        tl.fromTo("#s3-phone", { x: 838 }, { x: 0, duration: 0.8, ease: "power3.inOut" }, 0);
        tl.fromTo("#s3-kicker", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.45);
        tl.fromTo("#s3-headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.55);

        // Feature tiles fly out of the home screen into a grid (FLIP from their in-phone boxes)
        const tiles = [
          ["#s3-t1", 328.4, 308.7, 114.2, 900, 400],
          ["#s3-t2", 454.2, 308.7, 114.2, 1180, 400],
          ["#s3-t3", 580.0, 308.7, 114.2, 1460, 400],
          ["#s3-t4", 328.4, 416.8, 114.5, 900, 640],
          ["#s3-t5", 454.2, 416.8, 114.5, 1180, 640],
          ["#s3-t6", 580.0, 416.8, 114.5, 1460, 640],
        ];
        tiles.forEach(([sel, sx, sy, sw, gx, gy], i) => {
          const t = 0.9 + i * 0.25;
          tl.fromTo(
            sel,
            { x: sx - gx, y: sy - gy, scale: sw / 250, opacity: 0, transformOrigin: "0% 0%" },
            { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.3)", transformOrigin: "0% 0%" },
            t
          );
          tl.to(sel, { y: i % 2 ? 8 : -8, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, t + 0.8);
        });

        tl.to("#s3-wrap", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 5.6);
        window.__timelines["s3-utama"] = tl;
      </script>
