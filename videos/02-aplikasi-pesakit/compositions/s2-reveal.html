      <script>
        const tl = gsap.timeline({ paused: true });
        // Phase A — brand bloom on the drop
        tl.fromTo("#s2-logo", { scale: 0.2, rotation: -18, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.9, ease: "back.out(1.7)" }, 0);
        tl.fromTo("#s2-ring-1", { scale: 0.6, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 1.3, ease: "power2.out" }, 0.05);
        tl.fromTo("#s2-ring-2", { scale: 0.6, opacity: 0.7 }, { scale: 3.6, opacity: 0, duration: 1.6, ease: "power2.out" }, 0.2);
        tl.fromTo("#s2-word-1", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.35);
        tl.fromTo("#s2-word-2", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.47);
        tl.fromTo("#s2-brandname", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.7);
        tl.fromTo("#s2-tagline", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.05);
        tl.to("#s2-brand", { opacity: 0, scale: 0.9, filter: "blur(12px)", duration: 0.35, ease: "power2.in" }, 1.9);

        // Phase C — the phone arrives with the login screen
        tl.fromTo("#s2-phone", { y: 1100, rotation: 9, opacity: 1 }, { y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 2.05);
        tl.fromTo("#s2-kicker", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 2.25);
        tl.fromTo("#s2-headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.35);
        tl.fromTo("#s2-body", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.55);

        // The IC field lifts out of the phone, and the number types in
        tl.fromTo(
          "#s2-callout",
          { x: 365.1, y: -139.8, scale: 0.5735, opacity: 0, transformOrigin: "0% 0%" },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)", transformOrigin: "0% 0%" },
          3.0
        );
        tl.fromTo("#s2-type-clip", { width: 0 }, { width: 300, duration: 0.6, ease: "steps(14)" }, 3.2);
        // Tap "Log Masuk" and land on the home screen
        tl.fromTo("#s2-ripple", { scale: 0, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.55, ease: "power2.out" }, 3.8);
        tl.to("#s2-callout", { opacity: 0, y: 40, scale: 0.92, duration: 0.35, ease: "power2.in" }, 3.95);
        tl.fromTo("#s2-screen-utama", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 4.0);

        // Copy leaves; the phone stays put and is picked up by the next scene
        tl.to("#s2-copy", { opacity: 0, x: -80, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 5.55);
        window.__timelines["s2-reveal"] = tl;
      </script>
