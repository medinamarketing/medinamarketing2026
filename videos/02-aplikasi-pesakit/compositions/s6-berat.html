      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s6-phone", { y: 820, rotation: -8 }, { y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 0);
        tl.fromTo("#s6-kicker", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.2);
        tl.fromTo("#s6-headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);

        // Ring fills to 44% while the loss counts to -6.1 kg
        const ring = document.getElementById("s6-ring");
        const LEN = ring.getTotalLength();
        ring.style.strokeDasharray = LEN;
        tl.fromTo("#s6-progress", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        tl.fromTo(ring, { strokeDashoffset: LEN }, { strokeDashoffset: LEN * (1 - 0.44), duration: 1.4, ease: "power2.inOut" }, 0.8);
        const pctEl = document.getElementById("s6-ring-pct");
        const lossEl = document.getElementById("s6-loss");
        const st = { p: 0, kg: 0 };
        tl.fromTo(
          st,
          { p: 0, kg: 0 },
          {
            p: 44,
            kg: 6.1,
            duration: 1.4,
            ease: "power2.inOut",
            onUpdate: () => {
              pctEl.textContent = Math.round(st.p) + "%";
              lossEl.textContent = "−" + st.kg.toFixed(1) + " kg";
            },
          },
          0.8
        );

        // Switch to rewards: the phone flips to the Mata Ganjaran screen and the balance card lifts out
        tl.to("#s6-progress", { opacity: 0, y: -30, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, 2.75);
        tl.fromTo("#s6-screen-ganjaran", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 2.8);
        // In-phone card box: 1328.8, 193.5, w 366.5
        tl.fromTo(
          "#s6-points",
          { x: 1136.8, y: -306.5, scale: 366.5 / 560, opacity: 0, transformOrigin: "0% 0%" },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out", transformOrigin: "0% 0%" },
          3.1
        );
        ["#s6-earn-1", "#s6-earn-2", "#s6-earn-3"].forEach((sel, i) => {
          tl.fromTo(sel, { opacity: 0, x: -40, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 3.75 + i * 0.3);
        });

        tl.to("#s6-wrap", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 5.6);
        window.__timelines["s6-berat"] = tl;
      </script>
