          left: 840px;

        .phone-screen img {

      <div data-hf-id="hf-ke2d" id="s7-root" data-composition-id="s7-chat" data-width="1920" data-height="1080">
        <div data-hf-id="hf-7yxc" id="s7-wrap">

            <div data-hf-id="hf-9o7x" class="phone-screen"><img data-hf-id="hf-3htv" src="assets/screens/chat.jpg" alt=""></div>

          <div data-hf-id="hf-b22z" id="s7-copy">
            <div data-hf-id="hf-iplb" id="s7-kicker">CHAT DENGAN DOKTOR</div>
            <div data-hf-id="hf-8qno" id="s7-headline">Tanya doktor, <span data-hf-id="hf-u6l2" id="s7-headline-accent">terus dari app.</span></div>
            <div data-hf-id="hf-2ap3" id="s7-sub"><span data-hf-id="hf-2x78" id="s7-online"></span>Biasanya membalas dalam 1 jam (waktu klinik)</div>
          </div>

          <div data-hf-id="hf-qby5" class="s7-bubble" id="s7-b1"><img data-hf-id="hf-varn" src="assets/crops/bubble-1.jpg" alt=""></div>
          <div data-hf-id="hf-ag8l" id="s7-typing">
            <div data-hf-id="hf-p9k0" class="s7-dot" id="s7-dot-1"></div>
            <div data-hf-id="hf-xxfv" class="s7-dot" id="s7-dot-2"></div>
            <div data-hf-id="hf-tzbu" class="s7-dot" id="s7-dot-3"></div>
          </div>
          <div data-hf-id="hf-ua26" class="s7-bubble" id="s7-b2"><img data-hf-id="hf-oj58" src="assets/crops/bubble-2.jpg" alt=""></div>
          <div data-hf-id="hf-y867" class="s7-bubble" id="s7-b3"><img data-hf-id="hf-ytc1" src="assets/crops/bubble-3.jpg" alt=""></div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s7-phone", { y: 820, rotation: 8 }, { y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 0);
        tl.fromTo("#s7-kicker", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.2);
        tl.fromTo("#s7-headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.fromTo("#s7-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
        tl.fromTo("#s7-online", { scale: 0.6 }, { scale: 1.25, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0.6);

        // Patient asks
        tl.fromTo("#s7-b1", { opacity: 0, scale: 0.4, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)", transformOrigin: "100% 100%" }, 1.0);
        // Doctor is typing...
        tl.fromTo("#s7-typing", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", transformOrigin: "0% 100%" }, 1.55);
        ["#s7-dot-1", "#s7-dot-2", "#s7-dot-3"].forEach((sel, i) => {
          tl.fromTo(sel, { y: 0 }, { y: -10, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 3 }, 1.6 + i * 0.1);
        });
        tl.to("#s7-typing", { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in", transformOrigin: "0% 100%" }, 2.15);
        // Doctor replies
        tl.fromTo("#s7-b2", { opacity: 0, scale: 0.4, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.6)", transformOrigin: "0% 100%" }, 2.2);
        // Patient thanks
        tl.fromTo("#s7-b3", { opacity: 0, scale: 0.4, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)", transformOrigin: "100% 100%" }, 3.4);

        tl.to("#s7-wrap", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 5.6);
        window.__timelines["s7-chat"] = tl;
      </script>
